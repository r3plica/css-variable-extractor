<app-expansion-panel [title]="title">
  <div class="space-y-4">
    @for (example of examples; track example.name) {
      <div class="example-block">
        <h4 class="text-sm font-semibold text-gray-700 mb-2">{{ example.name }}</h4>
        <pre class="bg-gray-100 p-3 rounded text-xs overflow-x-auto"><code>{{ example.example }}</code></pre>
      </div>
    }
  </div>
</app-expansion-panel>
